<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#F7F7F9;}
  body{font-family:system-ui;-webkit-font-smoothing:auto;}
  .stage{position:relative;width:390px;height:96px;overflow:hidden;background:#F7F7F9;}
  .abs{position:absolute;}

  .card{background:#fff;border-radius:10px;left:14px;top:8px;width:362px;height:79.33px;}

  .divider{width:.3333px;height:41.33px;background:rgba(0,0,0,.084);top:26.67px;}
  .d1{left:134.667px;background:rgba(0,0,0,.088);} .d2{left:255.333px;}

  .num{line-height:1;font-weight:600;letter-spacing:.3px;color:#181819;white-space:nowrap;
       -webkit-font-smoothing:antialiased;}
  .unit{line-height:1;font-weight:400;color:#8C8D8F;white-space:nowrap;font-size:11.83px;
        -webkit-font-smoothing:antialiased;-webkit-text-stroke:.02px currentColor;}
  .n1{left:48.5px;top:26.01px;font-size:22px;}
  .n2{left:174.16px;top:26.01px;font-size:22px;}
  .n3{left:292.17px;top:26.01px;font-size:22px;}
  .u1{left:88.01px;top:34.835px;}
  .u2{left:203.67px;top:34.99px;}
  .u3{left:327px;top:34.99px;}

  .sl{font-size:11.5px;line-height:1;font-weight:400;color:#8E8F91;white-space:nowrap;
      -webkit-font-smoothing:antialiased;letter-spacing:.05px;}
  .s1{left:51.34px;top:57.25px;}
  .s2{left:172.01px;top:57.25px;}
  .s3{left:292.67px;top:57.25px;}
</style></head>
<body>
<div class="stage">
  <div class="abs card"></div>
  <div class="abs divider d1"></div>
  <div class="abs divider d2"></div>
  <div class="abs num n1">128</div><div class="abs unit u1">天</div>
  <div class="abs num n2">36</div><div class="abs unit u2">次</div>
  <div class="abs num n3">9.6</div><div class="abs unit u3">折</div>
  <div class="abs sl s1">剩余天数</div>
  <div class="abs sl s2">已省运费</div>
  <div class="abs sl s3">会员折扣</div>
</div>
</body></html>
